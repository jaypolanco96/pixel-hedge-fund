<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#241914" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Viewport-fixed HUD host: outside scrolling scene / sveltekit body wrapper. -->
		<div
			id="phf-hud-root"
			data-static
			style="position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;pointer-events:none;z-index:100000;overflow:visible;transform:none;filter:none;perspective:none;contain:none"
		></div>
	</body>
</html>
